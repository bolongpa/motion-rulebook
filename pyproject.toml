[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-rulebook"
version = "0.1.0"
description = "Expansion rules for panel-to-animation: user-editable canon depiction rulebooks compiled into prompt packs for video generators"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bolong Pan" }]
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
motion-rulebook = "motion_rulebook.cli:main"

[tool.setuptools.packages.find]
include = ["motion_rulebook*"]
